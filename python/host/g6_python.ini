; g6_python.ini - read from the folder that holds g6_python.dll (plugins\ next to gta6mod_runtime.dll).
; Design and layout: sdk/docs/python_host.md. Relative paths are relative to this folder.
; A missing file or key means the default shown here.

[python]
; 0 = the plugin does nothing and python312.dll is never loaded. 1 = start Python on the first script tick
; (gta6mod_runtime.ini [runtime] mode=full, and only while the single-player guard is open).
enable=0
; CPython 3.12 home: a folder with python312.dll and either Lib\ + DLLs\ (a normal install) or python312.zip
; (the Windows embeddable distribution, unpacked here). Nothing of the user's environment is used: no
; PYTHON* variables, no user site, no site-packages.
home=python
; Folder that contains the gta6mod package (a copy of sdk\python).
sdk_path=python_sdk
; Each *.py file here is one mod (files starting with _ are skipped).
mods_dir=mods\python
; More sys.path entries for mods' own libraries, separated by ';'.
extra_paths=
; 1 = let mods call natives re-db has not marked verified. Every native in 1.0.2.1 is "observed" today, so mods
; that call natives need 1 until natives are verified (same as G6_ALLOW_UNVERIFIED for the Luau host).
allow_unverified=0
; 1 = reload a mod when its file changes (new files load, deleted files unload), checked every reload_poll_ms.
hot_reload=0
reload_poll_ms=1000
; Watchdog, in ms of wall time: one mod tick or stop longer than tick_budget_ms (one mod load longer than
; load_budget_ms) is interrupted and that mod is disabled. 0 = no watchdog.
tick_budget_ms=2000
load_budget_ms=10000
; While the single-player guard refuses natives, the start is retried this often (500..60000 ms).
guard_retry_ms=5000
; 1 = write __pycache__ for the SDK (faster later starts). Mods are always compiled from source.
write_bytecode=1
