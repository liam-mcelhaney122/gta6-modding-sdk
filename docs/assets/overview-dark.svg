<text x="40" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c3c2b7" text-anchor="start">Modding SDK for GTA VI 1.0.2.1  ·  single-player  ·  offline  ·  verified against your own exe, not yet run in-game</text>
