<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
<title id="title">gta6-modding-sdk overview</title>
<desc id="desc">A private research pipeline produces the generated data in this repository; the data feeds the C, C++, Python and Luau bindings and the runtime DLL. Tiles list counts for build 1.0.2.1.</desc>
