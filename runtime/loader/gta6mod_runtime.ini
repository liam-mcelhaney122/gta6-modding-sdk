; gta6mod_runtime.ini - read from the folder that contains gta6mod_runtime.dll.
; A missing file or key means the default shown here.

[runtime]
; readonly : identify the build, resolve patterns, verify native handlers, log. No hook, no plugins.
; observe  : readonly + install the scrExecContext::Run detour and log the script threads it sees.
; full     : observe + load plugins\*.dll and tick their scripts on the bound script thread.
mode=readonly
; normal : headers/exports must match AND (imphash of the original import descriptors OR a file SHA-256) must match.
; strict : headers/exports AND a file SHA-256 match (mapped module file or exe_path).
identity=normal
; Optional: the ORIGINAL game_scarlett_master.exe (the host maps a patched copy, whose hash differs).
exe_path=
; 1 = refuse to start unless every signed anchor in patterns.hpp matches exactly once.
strict_patterns=0
; How long the init thread waits for the title image to appear.
wait_for_game_ms=120000

[script]
; Which script thread plugin scripts tick on (only with [runtime] mode=full):
; stable  : (alias first) the script thread the game keeps updating (state byte 2 or 3) with the longest
;           continuous presence, chosen after bind_observe_ms; one winner, rebinds when the bound thread finishes
;           (state >= 4) or is absent for rebind_absent_ms while other threads run (G-095).
; hash    : the same, but only threads whose name hash (scrThread+0x2b8) equals host_script_hash.
; observe : never tick; the hook only logs threads, name hashes and states.
; Empty/absent = hash if host_script_hash is non-zero, else stable.
bind=
; u32 name hash at scrThread+0x2b8 (see "script name hash first seen" log lines). Used by bind=hash.
host_script_hash=0
; continuous presence (ms) a thread needs before it can be bound
bind_observe_ms=3000
; the bound thread missing this long (ms) while other threads run: rebind (500..60000)
rebind_absent_ms=3000
min_tick_interval_ms=0
fiber_stack_kb=1024

[clock]
; auto   : game_time_ms follows the game timer block (resolved from the GET_GAME_TIMER handler) once
;          30 consecutive plausible samples were seen in the Run hook; the system timer before that
;          and as the fallback.
; system : always the system timer (QPC, capped at 1 s per update).
source=auto

[vfs]
; off     : vfs_add_overlay returns G6_E_NOT_IMPLEMENTED and nothing is mounted (default).
; overlay : vfs_add_overlay queues a fiDeviceRelative over each mount point below; it is mounted on
;           the script thread once the session guard reports single-player (needs [runtime] mode=full).
mode=off
; REQUIRED for overlay, UNKNOWN until verified live: how the game's own file device names a host folder.
; Format: <host prefix>|<game prefix>. Read the game prefix from the "mount table" log lines (roots of
; Relative devices) and confirm it live; nothing is mounted while this is empty.
path_map=
; Existing mount points to overlay (each must end in '/'). New entries are never created.
mount_points=platform:/,common:/
; Optional: a host folder the runtime itself queues at start (same rules as vfs_add_overlay).
root=

[guard]
; Single-player guard (docs/runtime_design.md §7). 1.0.2.1 has no session-state natives, so two checks
; must BOTH pass before any plugin native call or mods/ overlay mount:
; 1. offline_attested=1 : you state that the host blocks the game's network access (the ztrx firewall rule).
; 2. a read-only TCP check of this process (GetExtendedTcpTable, own PID) every scan_interval_ms. Any
;    ESTABLISHED/SYN_SENT connection to a non-loopback, non-link-local remote closes the guard until restart.
; Closed guard = native calls return G6_E_ONLINE_SESSION. NETWORK-namespace natives are always refused.
offline_attested=0
; 1000..10000 ms. A clean scan older than 20 s also closes the guard.
scan_interval_ms=5000

[ui]
; In-game menu overlay (g6ui.dll next to the runtime; README "UI overlay"). Needs [runtime] mode=full.
; 0 : no overlay; plugins' ui frame_register returns G6_E_NOT_IMPLEMENTED (default).
; 1 : load g6ui.dll, hook IDXGISwapChain::Present/ResizeBuffers and ID3D12CommandQueue::ExecuteCommandLists, draw
;     Dear ImGui on the host's swap chain. Mods' menus run only while the single-player guard is open.
overlay=0
; Virtual-key code that shows/hides the menu (and gives it the mouse and keyboard). 0x2D = Insert.
toggle_key=0x2D
; Which command queue the overlay submits on: auto (the swap chain's own queue if DXGI reports it, else
; the one ExecuteCommandLists shows) or ecl (ExecuteCommandLists only).
queue=auto

[log]
; debug | info | warn
level=info
