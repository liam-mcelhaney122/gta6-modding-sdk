; g6probe.ini - read from the folder that holds g6probe.dll (plugins\ next to gta6mod_runtime.dll).
; Per-stage copies: tools\live\stages\g6probe.stage3.ini and g6probe.stage4.ini.

[probe]
; REQUIRED, no default: 3 = read-only (no setter is ever called), 4 = allow-listed write probes on a trigger.
stage=3
; JSONL output; a relative path is next to g6probe.dll. Records are appended; each load writes an "ev":"meta" record first.
jsonl=g6probe.jsonl
; Samples per second (0.1..20).
rate_hz=2
; wall = GetTickCount64 (default). game = the runtime's game_time_ms (pauses with the game; used by the offline test).
rate_clock=wall
; Stop writing records after this many MiB in the file.
max_mb=256
; Plausibility bound for coordinates (probe choice, not a game fact): |x|,|y|,|z| above this are flagged.
max_abs_coord=100000
; 1 = refuse an anchor whose live RVA differs from the re-db RVA in probe_layout.hpp.
anchor_rva_check=1
; Search radius in metres (1..1000) of GET_CLOSEST_PED / GET_CLOSEST_VEHICLE around the player, for the second-entity
; handles in each sample's "near" object (G-003). A probe choice, not a game fact.
near_radius_m=50

[writes]
; Stage 4 only. Comma-separated, executed in this order, each exactly once, one per trigger:
;   coords_up    SET_ENTITY_COORDS to the current position + up_delta_m along up_axis (player on foot)
;   health       SET_ENTITY_HEALTH to current + health_delta (must stay in [1, max health])
;   wanted_clear CLEAR_PLAYER_WANTED_LEVEL for the player ped (the handler reads a ped handle, G-090)
;   clock_add    ADD_TO_CLOCK_TIME(1, 0, 0)
allow=
; NO DEFAULT: x|y|z with optional sign (+z, -y, ...); coords_up is refused while this is unset. Stage 3 showed +z
; (G-011, findings/live/2026-11-25_stage3.md); tools/live/stages/g6probe.stage4.ini sets it.
up_axis=
up_delta_m=1.0
health_delta=-10
; Virtual-key code of the trigger key (0x79 = F10); only while the game window is in front. 0 = no key.
hotkey=0x79
; Creating this file (relative = next to g6probe.dll) also fires the next write probe; the probe deletes it.
trigger_file=g6probe.fire

[wait]
; script_wait probe (G-010): a second script waits probe_ms per round and logs the game/wall time that passed.
; 0 = off.
probe_ms=0
count=20
